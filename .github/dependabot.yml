version: 2

updates:
  # Maven. Patch and minor updates are grouped into a single pull request:
  # a stream of one-line bumps is noise that teams learn to ignore, which is
  # how a genuinely important update gets missed.
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      spring:
        patterns: ['org.springframework*', 'org.hibernate*', 'jakarta.*']
        update-types: [minor, patch]
      test-tooling:
        patterns: ['org.testcontainers*', 'org.junit*', 'org.mockito*', 'org.assertj*']
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router-dom', '@types/react*']
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'typescript']
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # Pinned action versions go stale silently and are a supply-chain risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
