# Production. Every secret is required from the environment; there are no fallbacks.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

minibank:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    enabled: false

# The interactive API explorer is a development tool; it is not served in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  config: classpath:logback-json.xml
  level:
    root: WARN
    com.minibank: INFO
