# MBank local stack: PostgreSQL, the API, and the frontend behind nginx.
#
#   docker compose up --build
#
# Every secret is read from the environment (see .env.example). Nothing sensitive
# is hard-coded here, so this file is safe to commit.

services:
  postgres:
    image: postgres:16-alpine
    container_name: minibank-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-minibank}
      POSTGRES_USER: ${DB_USERNAME:-minibank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      # Deterministic collation, so ordering does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed for psql and for tooling. Remove this mapping to keep the
      # database reachable only from inside the compose network.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # The API waits on this rather than on a timer, so a slow first start of
      # the database cannot turn into a failed boot of the application.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-minibank} -d ${DB_NAME:-minibank}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minibank-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-minibank}
      DB_USERNAME: ${DB_USERNAME:-minibank}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 characters, see .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Where a verification link should point: the web client, not the API.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # This stack has no SMS gateway and no mail relay, so both providers log
      # instead of sending. Set SMS_PROVIDER=twilio (with credentials) or
      # EMAIL_PROVIDER=smtp (with spring.mail.*) to deliver for real.
      SMS_PROVIDER: ${SMS_PROVIDER:-dev}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev}
      # Returns the one-time code in the API response so the phone sign-in can be
      # tried without a handset. This is a local demo stack; the prod profile
      # refuses to start with it enabled.
      EXPOSE_VERIFICATION_CODES: ${EXPOSE_VERIFICATION_CODES:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time: a browser bundle has no server-side config.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: minibank-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
