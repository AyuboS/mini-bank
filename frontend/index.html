<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MBank — money that moves the way you expect" />
    <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- The mark, inlined: no extra request and no binary asset. The font is imported in main.tsx. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230B6B43'/%3E%3Cpath d='M9 31V10h6.2l4.8 8.6L24.8 10H31v21h-5.1V19.3l-4.2 7.2h-3.4l-4.2-7.2V31H9Z' fill='%23fff'/%3E%3C/svg%3E"
    />

    <title>MBank</title>

    <script>
      /*
        Applied before first paint. Reading the preference from React would leave
        one frame of the wrong theme on screen, which is exactly the thing people
        notice.

        An explicit choice wins. With no choice stored, the operating system
        decides: somebody who runs their machine dark gets a dark bank without
        having to ask, and everyone else gets the light one.
      */
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('minibank.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {
          /* Storage denied in a private window: fall through to light. */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
