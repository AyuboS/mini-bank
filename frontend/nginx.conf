# Serves the built single-page application.
#
# NOTE on add_header: nginx does not merge these across levels. A location block
# that declares any add_header of its own discards every add_header inherited
# from the server block. The security headers are therefore repeated in each
# location that sets a header, rather than relying on inheritance -- getting this
# wrong silently strips the headers from exactly the responses that matter most.
server {
    # Port 8080, not 80: the container runs as an unprivileged user, which
    # cannot bind to ports below 1024.
    #
    # Both address families are bound. With IPv4 only, anything inside the
    # container that resolves "localhost" to ::1 -- busybox wget, for one --
    # gets a connection refused while external traffic works perfectly, which
    # makes for a container that serves pages and still reports unhealthy.
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Client-side routing: unknown paths are the app's routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames make these safe to cache indefinitely.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached, or a deployment would not reach open tabs.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
